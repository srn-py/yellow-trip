# monitoring/prometheus/prometheus.yml
# What Prometheus collects, and how often.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Every API service exposes /metrics (see shared/observability.py).
  - job_name: platform-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - ingestion:8000
          - cleaning:8000
          - etl:8000
          - analytics:8000
          - quality:8000
    relabel_configs:
      # Turn "ingestion:8000" into a label service="ingestion" so dashboards can group by service.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
        replacement: "$1"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
