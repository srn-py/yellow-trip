# dbt/profiles.yml
# How dbt connects to the warehouse. Values come from environment variables (see .env),
# so no password is written in this file.
taxi_platform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'warehouse') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'taxi') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'taxi_dw') }}"
      schema: analytics
      threads: 4