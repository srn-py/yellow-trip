# .github/workflows/ci.yml
# Runs on every push to main and on every pull request.
# Cheap checks first; the slow end-to-end job only runs when they pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # the workflow may only read the repository

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # a newer push replaces a run that is still going

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/**/requirements.txt
      - name: Install dependencies
        run: >
          pip install
          -r services/ingestion/requirements.txt
          -r services/cleaning/requirements.txt
          -r services/analytics/requirements.txt
          -r services/quality/requirements.txt
          plotly pyyaml pytest
      - name: Run unit tests
        run: pytest -p no:cacheprovider       # integration tests are skipped by default

  dbt-parse:
    name: dbt project parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "dbt-core>=1.8,<2.0" "dbt-postgres>=1.8,<2.0"
      - name: Parse (finds SQL, Jinja and YAML mistakes without a database)
        env:
          POSTGRES_PASSWORD: ci-not-a-real-secret
        run: dbt parse --project-dir dbt --profiles-dir dbt

  build-images:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion, cleaning, etl, analytics, quality, dashboard, airflow]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false                          # building proves the Dockerfile works; publishing comes in Milestone 8
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  integration:
    name: Integration test (real services)
    needs: [lint, unit-tests, dbt-parse]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install httpx pyarrow pytest
      - name: Start the throw-away stack
        run: docker compose --env-file .env.example -f docker-compose.integration.yml -p taxi-it up -d --build --wait --wait-timeout 900
      - name: Run the end-to-end test
        run: pytest --noconftest -m integration tests/integration -p no:cacheprovider
      - name: Show service logs if something failed
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.integration.yml -p taxi-it logs --tail=100
      - name: Remove the stack
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.integration.yml -p taxi-it down -v
